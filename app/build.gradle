plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kevin589981.onetaplock'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.kevin589981.onetaplock'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('SIGNING_KEYSTORE_PATH') ?: 'missing-release-keystore')
            storePassword System.getenv('SIGNING_PASSWORD')
            keyAlias 'one-tap-lock'
            keyPassword System.getenv('SIGNING_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
